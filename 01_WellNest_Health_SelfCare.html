<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#25846b"><title>WellNest | Health & Self-Care</title><style>
:root{--p:#25846b;--p2:#17644f;--t:#19243a;--m:#68758c;--bg:#f5f7fc;--line:#e4e9f2;--soft:#edf8f3}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--t)}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5%;position:sticky;top:0}.brand{display:flex;align-items:center;gap:11px;font-weight:850;font-size:20px}.logo{background:var(--p);color:#fff;border-radius:13px;padding:10px 13px}.tag{font-size:11px;font-weight:800;color:var(--p2);background:var(--soft);padding:8px 11px;border-radius:99px}.page{max-width:1120px;margin:30px auto;padding:0 18px}.hero{margin-bottom:25px}.hero small{color:var(--p);font-weight:850;letter-spacing:1.8px}.hero h1{font-size:clamp(30px,4vw,43px);letter-spacing:-1.5px;margin:10px 0}.hero p,.muted{color:var(--m);line-height:1.6}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}.card{background:white;border:1px solid var(--line);border-radius:19px;padding:22px;box-shadow:0 12px 34px #17294b0b;min-width:0}.s12{grid-column:span 12}.s8{grid-column:span 8}.s6{grid-column:span 6}.s4{grid-column:span 4}.card h2,.card h3{margin-top:0}.btn{border:0;border-radius:11px;padding:11px 15px;font-weight:750}.primary{background:var(--p);color:white}.soft{background:var(--soft);color:var(--p2)}.ghost{background:white;border:1px solid var(--line);color:var(--m)}.danger{background:#fff0f1;color:#a93245}.field{margin-bottom:14px}.field label{display:block;font-size:13px;font-weight:750;color:#4f5c73;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #d9e0eb;border-radius:11px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--p);box-shadow:0 0 0 3px #5265e81a}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:15px}.stat small{color:var(--m);font-weight:700}.stat b{display:block;font-size:26px;margin-top:5px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.nav button{background:white;border:1px solid var(--line);border-radius:10px;padding:10px 13px;color:var(--m);font-weight:750}.nav button.active{background:var(--p);color:white;border-color:var(--p)}.item{border:1px solid var(--line);border-radius:14px;padding:16px;margin:11px 0;background:white}.item p{color:var(--m);line-height:1.55;margin-bottom:0}.item h3,.item h4{margin:0 0 7px}.notice{padding:12px 14px;border-radius:12px;background:var(--soft);color:var(--p2);font-size:13px;line-height:1.5;margin-top:14px}.message{font-size:13px;color:var(--m);min-height:17px}.error{color:#b3261e}.success{color:#16845b}.hidden{display:none!important}.authwrap{min-height:calc(100vh - 72px);display:grid;place-items:center;padding:22px}.auth{width:min(100%,450px)}.auth h1{font-size:30px;letter-spacing:-1px}.auth p{color:var(--m);line-height:1.5}.link{border:0;background:transparent;color:var(--p);font-weight:800}.slotgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.slot{padding:17px 4px;border-radius:12px;border:1px solid #d8e0eb;font-weight:800}.available{background:#e7f8ee;color:#16734b;border-color:#b9e8cb}.occupied{background:#fff0f1;color:#a93245;cursor:not-allowed}.selected{outline:3px solid var(--p)}.media{background:var(--soft);border-radius:12px;min-height:120px;display:grid;place-items:center;font-size:40px;margin-bottom:12px}.price{font-size:29px;font-weight:900}.small{font-size:12px;color:var(--m)}@media(max-width:740px){.top{height:64px;padding:0 15px}.page{margin:22px auto}.s8,.s6,.s4{grid-column:span 12}.row{grid-template-columns:1fr}.stats{gap:7px}.stat{padding:11px}.stat b{font-size:21px}.card{padding:17px}.slotgrid{grid-template-columns:repeat(3,1fr)}.tag{display:none}}
</style></head>
<body><header class="top"><div class="brand"><span class="logo">✦</span>WellNest</div><div style="display:flex;gap:12px;align-items:center"><span class="tag">MINDFUL LIVING</span><div id="userChip" class="hidden" style="display:flex;gap:8px;align-items:center"><span id="avatar" style="background:var(--soft);color:var(--p);border-radius:50%;padding:9px;font-weight:800">U</span><span id="userName" style="font-size:13px;font-weight:800"></span><button class="btn ghost" onclick="logout()">Sign out</button></div></div></header>
<section id="authView" class="authwrap"><div class="card auth"><small style="color:var(--p);font-weight:850;letter-spacing:1.4px">MINDFUL LIVING</small><h1 id="authTitle">Welcome back</h1><p id="authSub">Sign in to continue.</p><form id="authForm"><div id="nameField" class="field hidden"><label>Full name</label><input id="name" placeholder="Your full name"></div><div class="field"><label>Email address</label><input id="email" type="email" placeholder="you@example.com" required></div><div class="field"><label>Password</label><input id="password" type="password" minlength="4" placeholder="At least 4 characters" required></div><button id="authSubmit" class="btn primary" style="width:100%">Sign in</button><p id="authMsg" class="message"></p></form><p><span id="switchText">New here?</span> <button id="switchBtn" class="link">Create account</button></p><div class="notice">Demo project: account details are stored in this browser only. Do not use a real password.</div></div></section>
<section id="appView" class="hidden"><main class="page"><div class="hero"><small>MINDFUL LIVING</small><h1>Make space for your wellbeing.</h1><p>A calmer day can begin with one small, intentional step.</p></div><nav class="nav"><button data-tab="overview" class="active">Overview</button><button data-tab="health" class="">Health routines</button><button data-tab="selfcare" class="">Self-care library</button><button data-tab="journal" class="">Journal</button></nav><div id="workspace"></div></main></section>
<script>const APP="wellnest";
const $=id=>document.getElementById(id);let mode='login',user=null;
function setmsg(id,t,c=''){let e=$(id);if(e){e.textContent=t;e.className='message '+c}}
function getUsers(){return JSON.parse(localStorage.getItem(APP+'_users')||'{}')}
function switchMode(){mode=mode==='login'?'register':'login';$('authTitle').textContent=mode==='login'?'Welcome back':'Create your account';$('authSub').textContent=mode==='login'?'Sign in to continue.':'Create an account to get started.';$('nameField').classList.toggle('hidden',mode==='login');$('name').required=mode==='register';$('authSubmit').textContent=mode==='login'?'Sign in':'Create account';$('switchText').textContent=mode==='login'?'New here?':'Already have an account?';$('switchBtn').textContent=mode==='login'?'Create account':'Sign in';setmsg('authMsg','')}
$('switchBtn').onclick=switchMode;
$('authForm').onsubmit=e=>{e.preventDefault();let email=$('email').value.trim().toLowerCase(),password=$('password').value,u=getUsers();if(mode==='register'){if(u[email])return setmsg('authMsg','An account with this email already exists.','error');u[email]={name:$('name').value.trim(),password};localStorage.setItem(APP+'_users',JSON.stringify(u));setmsg('authMsg','Account created. Please sign in.','success');switchMode();$('email').value=email}else{if(!u[email]||u[email].password!==password)return setmsg('authMsg','Email or password is incorrect.','error');user={email,...u[email]};sessionStorage.setItem(APP+'_session',email);openApp()}};
function openApp(){$('authView').classList.add('hidden');$('appView').classList.remove('hidden');$('userChip').classList.remove('hidden');$('userName').textContent=user.name;$('avatar').textContent=(user.name[0]||'U').toUpperCase();if(typeof initSlots==='function'){initSlots();renderSlots();$('location').value=localStorage.getItem(APP+'_loc_'+user.email)||'City Centre'}showTab(APP==='parkwise'?'parking':APP==='fitforge'?'home':APP==='careerlane'?'dashboard':'overview')}
function logout(){sessionStorage.removeItem(APP+'_session');user=null;$('appView').classList.add('hidden');$('authView').classList.remove('hidden');$('userChip').classList.add('hidden');$('password').value=''}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
let ses=sessionStorage.getItem(APP+'_session'),old=getUsers();if(ses&&old[ses]){user={email:ses,...old[ses]};openApp()}

function showTab(t){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));let w=$('workspace');
if(t==='overview')w.innerHTML=`<div class="grid"><section class="card s8"><small style="color:var(--p);font-weight:800">YOUR DAILY RESET</small><h2>A little care goes a long way.</h2><p class="muted">Choose one small action today. Consistency matters more than perfection.</p><div class="stats"><div class="stat"><small>Mindful minutes</small><b id="mins">0</b></div><div class="stat"><small>Daily habits</small><b>3</b></div><div class="stat"><small>Today's focus</small><b>Calm</b></div></div></section><section class="card s4"><h3>2-minute breathing</h3><p class="muted">Breathe gently and slowly. Stop if you feel uncomfortable.</p><button class="btn primary" id="breathBtn" onclick="breath()">Start session</button><p id="breathMsg" class="message"></p></section><section class="card s6"><h2>Health routine</h2><div class="item"><h4>Morning stretch · 5 min</h4><p>Move gently before starting your day.</p></div><div class="item"><h4>Hydration break</h4><p>Keep water nearby and take regular breaks.</p></div><div class="item"><h4>Wind-down routine</h4><p>Try a quiet activity before bedtime.</p></div></section><section class="card s6"><h2>Self-care check-in</h2><div class="field"><label>Mood</label><select id="mood"><option>Calm</option><option>Happy</option><option>Tired</option><option>Stressed</option><option>Low</option></select></div><div class="field"><label>A thought to remember (optional)</label><textarea id="note" rows="3" placeholder="Write a kind note to yourself..."></textarea></div><button class="btn primary" onclick="saveCheckin()">Save check-in</button><p id="checkMsg" class="message"></p></section></div>`;
else if(t==='health'||t==='selfcare'){let h=t==='health',a=h?[['Build a gentle morning','Start with water, light movement and one realistic priority.','ROUTINE'],['Take movement breaks','Stand, stretch or walk briefly after long sitting.','MOVEMENT'],['Create a sleep rhythm','Try a consistent bedtime and relaxing pre-sleep routine.','SLEEP']]:[['Practice self-compassion','Respond to yourself as you would to a friend.','MINDSET'],['Take a digital pause','Step away from screens for a few minutes.','RESET'],['Connect with someone','A conversation with someone you trust may help you feel supported.','CONNECTION']];w.innerHTML=`<section class="card"><h2>${h?'Health routine library':'Self-care library'}</h2><p class="muted">Read a short guide and choose one idea to try today.</p>${a.map(x=>`<article class="item"><span class="tag">${x[2]}</span><h3>${x[0]}</h3><p>${x[1]}</p><button class="btn soft" style="margin-top:12px" onclick="readArticle('${x[0]}')">Mark as read</button></article>`).join('')}<p id="readMsg" class="message"></p></section>`}
else{w.innerHTML=`<section class="card"><h2>Private journal</h2><p class="muted">This entry is stored in this browser on this device.</p><div class="field"><label>Today's reflection</label><textarea id="journal" rows="6" placeholder="What went well? What do you need today?"></textarea></div><button class="btn primary" onclick="saveJournal()">Save entry</button><p id="journalMsg" class="message"></p></section>`;$('journal').value=localStorage.getItem(APP+'_journal_'+user.email)||''}}
function readArticle(t){let k=APP+'_read_'+user.email,a=JSON.parse(localStorage.getItem(k)||'[]');if(!a.includes(t))a.push(t);localStorage.setItem(k,JSON.stringify(a));setmsg('readMsg','Marked “'+t+'” as read.','success')}
function saveCheckin(){localStorage.setItem(APP+'_checkin_'+user.email,JSON.stringify({mood:$('mood').value,note:$('note').value,date:new Date().toLocaleString()}));setmsg('checkMsg','Check-in saved on this device.','success')}
function saveJournal(){localStorage.setItem(APP+'_journal_'+user.email,$('journal').value);setmsg('journalMsg','Journal entry saved on this device.','success')}
let bt=null;function breath(){if(bt)return;let n=120;$('breathBtn').disabled=true;bt=setInterval(()=>{n--;$('breathMsg').textContent=n>0?`Breathe slowly… ${Math.floor(n/60)}:${String(n%60).padStart(2,'0')} remaining`:'Session complete. Well done for taking a pause.';if(n<=0){clearInterval(bt);bt=null;$('breathBtn').disabled=false;$('breathBtn').textContent='Start again';$('mins').textContent='2'}},1000)}
</script></body></html>
